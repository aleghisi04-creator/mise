name: Test photo sources
on:
  push:
    branches: [photo-test]
    paths: [tools/test-sources.mjs]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save sharp@0.33.5
      - run: node tools/test-sources.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add test && git commit -m "Photo source test results" && git push
